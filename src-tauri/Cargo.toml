[package]
name = "fcs-manager"
version = "0.1.0"
description = "Non-destructive FCS formatter desktop app"
authors = ["Codex"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
anyhow = "1.0.98"
flow-fcs = "0.2.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tauri = { version = "2.3.1", features = [] }
tauri-plugin-dialog = "2.2.0"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.20.0"
